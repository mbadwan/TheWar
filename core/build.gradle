apply plugin: "java-library"


[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
    main {
        java {
            srcDirs = ["src/"]
        }
    }
}


dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
    api "com.badlogicgames.gdx:gdx-ai:1.8.2"
    implementation('com.h2database:h2:2.2.224')
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.23.1' //error when updating
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-external-antlr:2.7.0-alpha04'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.23.1'

}
java.targetCompatibility = JavaVersion.VERSION_1_8
java.sourceCompatibility = JavaVersion.VERSION_1_8
configurations {
    natives
}
