
buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }

        maven { url "https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core" }
        google()
    }
    dependencies {
        classpath 'org.docstr:gwt-gradle-plugin:1.1.29'
        classpath 'org.gretty:gretty:3.1.0'
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath 'com.mobidevelop.robovm:robovm-gradle-plugin:2.3.20'

    }
}

plugins {
    id 'org.liquibase.gradle' version '2.0.4' // for Liquibase
    id 'java'
    id 'eclipse'

}
configurations {
    natives
}

allprojects {


    version = '1.0'
    ext {
        appName = "theWar"
        gdxVersion = '1.12.1'
        roboVMVersion = '2.3.21'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        gdxControllersVersion = '2.2.3'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
        maven { url "https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core" }

    }
}


sourceSets {
    main {
        java {
            srcDirs = ["src/"]
        }
        resources {
            srcDirs = ["../assets"]
        }
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {

    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.23.1'

}
jar {
    manifest {
        attributes(
                'Main-Class': 'com.thewar.desktop'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from('assets/') {
        into 'assets/'
    }
}